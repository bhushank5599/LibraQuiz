server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: book-service
          uri: lb://BOOK-SERVICE
          predicates:
            - Path=/api/books/**

        - id: library-transaction-service
          uri: lb://LIBRARY-TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**

        - id: course-service
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/api/courses/**

        - id: question-bank-service
          uri: lb://QUESTION-BANK-SERVICE
          predicates:
            - Path=/api/questions/**

        - id: question-management-service
          uri: lb://QUESTION-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/question-management/**

        - id: quiz-service
          uri: lb://QUIZ-SERVICE
          predicates:
            - Path=/api/quizzes/**

        - id: examination-service
          uri: lb://EXAMINATION-SERVICE
          predicates:
            - Path=/api/exams/**

        - id: result-service
          uri: lb://RESULT-SERVICE
          predicates:
            - Path=/api/results/**

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/ai/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
